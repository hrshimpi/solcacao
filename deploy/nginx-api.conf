# Nginx template for the API on the Lightsail instance. Replace API_HOSTNAME and API_PORT (the PORT in .env), then copy
# the file to /etc/nginx/sites-available/solcacao-api and link it into sites-enabled. Certbot adds the HTTPS part itself.
server {
    listen 80;
    listen [::]:80;
    server_name API_HOSTNAME;

    # the API accepts up to 5 files of 50 MB in one request, so this has to be a little more than 250 MB
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:API_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a big upload on a slow connection needs more than the default 60 seconds
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
